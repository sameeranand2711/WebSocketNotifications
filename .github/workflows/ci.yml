name: Build, test, and package

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - release/v1.0.0-rc.2
      - release/v1-stage-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  dotnet:
    name: .NET 10 and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore with locked dependencies and audit
        run: dotnet restore WebSocketNotifications.slnx --locked-mode

      - name: Build release
        run: dotnet build WebSocketNotifications.slnx --configuration Release --no-restore

      - name: Run all .NET tests
        run: dotnet test WebSocketNotifications.slnx --configuration Release --no-build --no-restore --logger "console;verbosity=minimal"

      - name: Pack release artifacts
        run: dotnet pack src/WebSocketNotifications/WebSocketNotifications.csproj --configuration Release --no-build --no-restore --output artifacts/packages/current

      - name: Inspect package contents and metadata
        shell: pwsh
        run: ./scripts/inspect-package.ps1

      - name: Test package in a clean external app
        shell: pwsh
        run: ./scripts/run-package-smoke-test.ps1

      - name: Retain NuGet artifacts
        uses: actions/upload-artifact@v6
        with:
          name: websocket-notifications-packages
          path: artifacts/packages/current/
          if-no-files-found: error
          retention-days: 14

  client:
    name: Next.js client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: samples/clients/websocket-notifications-nextjs
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: samples/clients/websocket-notifications-nextjs/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run JavaScript tests
        run: npm test

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build optimized client
        run: npm run build
